<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สถานะบิลคงค้าง · ราย DC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- data-live: fetches Google Sheets CSV and builds window.DCDATA -->
<script>
(function () {

  var THAI_MONTHS = ['m.k.','k.p.','mi.k.','me.y.','ph.k.','mi.y.','k.k.','s.k.','k.y.','t.k.','ph.y.','th.k.'];
  // real Thai month abbreviations stored separately to avoid encoding issues
  var TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  function parseThaiDate(str) {
    if (!str) return null;
    var s = str.trim();
    var parts = s.split('/');
    if (parts.length !== 3) return null;
    var dy = parseInt(parts[0], 10);
    var mo = parseInt(parts[1], 10) - 1;
    var yr = parseInt(parts[2], 10) - 543;
    if (isNaN(dy) || isNaN(mo) || isNaN(yr)) return null;
    if (mo < 0 || mo > 11 || dy < 1 || dy > 31) return null;
    return new Date(yr, mo, dy);
  }

  function billAgeToday(jsDate) {
    if (!jsDate) return 0;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diff = today - jsDate;
    return diff < 0 ? 0 : Math.floor(diff / 86400000);
  }

  // Robust CSV parser — strict i < line.length, no infinite loops
  function parseCSV(text) {
    // strip BOM
    var clean = (text.charCodeAt(0) === 0xFEFF) ? text.slice(1) : text;
    // detect HTML response
    var trimmed = clean.trimLeft ? clean.trimLeft() : clean.replace(/^\s+/, '');
    if (trimmed.charAt(0) === '<') {
      throw new Error('URL returned HTML not CSV. Please re-publish the sheet as CSV.');
    }
    var lines = clean.split(/\r\n|\r|\n/);
    var result = [];
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      var row = [];
      var i = 0;
      var len = line.length;
      while (i < len) {
        if (line.charAt(i) === '"') {
          i++;
          var field = '';
          while (i < len) {
            var ch = line.charAt(i);
            if (ch === '"') {
              if (line.charAt(i + 1) === '"') { field += '"'; i += 2; }
              else { i++; break; }
            } else {
              field += ch; i++;
            }
          }
          row.push(field);
          if (i < len && line.charAt(i) === ',') i++;
        } else {
          var start = i;
          while (i < len && line.charAt(i) !== ',') i++;
          row.push(line.slice(start, i));
          if (i < len) i++; // skip comma
        }
      }
      // trailing comma means one more empty field
      if (len > 0 && line.charAt(len - 1) === ',') row.push('');
      // only keep rows that have at least one non-empty cell
      var hasContent = false;
      for (var ci = 0; ci < row.length; ci++) {
        if (row[ci].trim()) { hasContent = true; break; }
      }
      if (hasContent) result.push(row);
    }
    return result;
  }

  var STATUSES = [
    { key: 's031',  code: '031',      label: 'สินค้าถึง DC ปลายทาง (รอกระจาย)',       short: 'รอกระจาย',              color: '#8c98a8' },
    { key: 's033',  code: '033',      label: 'สินค้าถึง DC ปลายทาง (ลูกค้ารับเอง)',   short: 'ลูกค้ารับเอง',          color: '#3f7fd1' },
    { key: 'f1',    code: '05101031', label: 'สินค้ารอกระจาย (ส่งไม่ได้ครั้งที่ 1)',  short: 'ส่งไม่ได้ · ครั้งที่ 1',  color: '#e0a93f' },
    { key: 'f2',    code: '05102031', label: 'สินค้ารอกระจาย (ส่งไม่ได้ครั้งที่ 2)',  short: 'ส่งไม่ได้ · ครั้งที่ 2',  color: '#d97a2b' },
    { key: 'f3',    code: '05103031', label: 'สินค้ารอกระจาย (ส่งไม่ได้ครั้งที่ 3)',  short: 'ส่งไม่ได้ · ครั้งที่ 3',  color: '#c5432f' },
    { key: 'clear', code: 'CLEAR',    label: 'รับบิลเข้าเคลียร์',                      short: 'เคลียร์ (มีปัญหา)',      color: '#a259d8' },
  ];
  var statusByCode = {};
  for (var si = 0; si < STATUSES.length; si++) { statusByCode[STATUSES[si].code] = STATUSES[si]; }

  // Extract bill-level rows from parsed CSV: [{ bill, dc, isCold, status }]
  function parseBillRows(rows) {
    var header = [];
    for (var hi = 0; hi < rows[0].length; hi++) {
      header.push((rows[0][hi] || '').trim().replace(/ /g, ' '));
    }
    function ci(name, fb) {
      for (var x = 0; x < header.length; x++) { if (header[x] === name) return x; }
      for (var x = 0; x < header.length; x++) { if (header[x] && (header[x].indexOf(name) !== -1 || name.indexOf(header[x]) !== -1)) return x; }
      return fb;
    }
    var CB = ci('เลขที่บิล', 1);
    var CD = ci('DC ปลายทาง', 17);
    var CT = ci('ประเภทบิล', 24);
    var CS = ci('สถานะบิล', 19);
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var bill = r[CB] ? r[CB].trim() : '';
      var dc   = r[CD] ? r[CD].trim() : '';
      if (!bill || !dc) continue;
      out.push({ bill: bill, dc: dc, isCold: !!(r[CT] && r[CT].indexOf('Coldchain') !== -1), status: r[CS] ? r[CS].trim() : '' });
    }
    return out;
  }

  // Compare baseline bills vs current bills → { dcs, byType }
  function buildCompareData(baseBills, curBills) {
    var curMap = {};
    for (var ci2 = 0; ci2 < curBills.length; ci2++) { curMap[curBills[ci2].bill] = curBills[ci2]; }
    var dcMap2 = {};
    for (var bi = 0; bi < baseBills.length; bi++) {
      var b = baseBills[bi];
      if (!dcMap2[b.dc]) dcMap2[b.dc] = [];
      dcMap2[b.dc].push(b);
    }
    function mkBT() { return { baseline: 0, cleared: 0, remaining: 0, st: {} }; }
    var dcs = [];
    var dcNames = Object.keys(dcMap2);
    for (var di = 0; di < dcNames.length; di++) {
      var name = dcNames[di];
      var dcBills = dcMap2[name];
      var byType = { all: mkBT(), gen: mkBT(), cold: mkBT() };
      for (var bi2 = 0; bi2 < dcBills.length; bi2++) {
        var bill = dcBills[bi2];
        var tkey = bill.isCold ? 'cold' : 'gen';
        byType.all.baseline++; byType[tkey].baseline++;
        var cur = curMap[bill.bill];
        if (!cur) {
          byType.all.cleared++; byType[tkey].cleared++;
        } else {
          byType.all.remaining++; byType[tkey].remaining++;
          var rawSt = cur.status || '';
          var sk = 'other';
          if (statusByCode[rawSt]) {
            sk = statusByCode[rawSt].key;
          } else {
            var codeKeys = Object.keys(statusByCode);
            for (var cki = 0; cki < codeKeys.length; cki++) {
              if (rawSt.indexOf(codeKeys[cki]) === 0) { sk = statusByCode[codeKeys[cki]].key; break; }
            }
          }
          byType.all.st[sk] = (byType.all.st[sk] || 0) + 1;
          byType[tkey].st[sk] = (byType[tkey].st[sk] || 0) + 1;
        }
      }
      var cm = name.match(/^(\d+)/);
      dcs.push({ code: cm ? cm[1] : name, name: name, region: '', byType: byType,
        cleared: byType.all.cleared, remaining: byType.all.remaining, baseline: byType.all.baseline, st: byType.all.st });
    }
    dcs.sort(function(a, b) { return b.remaining - a.remaining; });
    var sysBy = { all: mkBT(), gen: mkBT(), cold: mkBT() };
    var typeKeys = ['all', 'gen', 'cold'];
    for (var dci = 0; dci < dcs.length; dci++) {
      for (var ti = 0; ti < typeKeys.length; ti++) {
        var t = typeKeys[ti];
        sysBy[t].baseline  += dcs[dci].byType[t].baseline;
        sysBy[t].cleared   += dcs[dci].byType[t].cleared;
        sysBy[t].remaining += dcs[dci].byType[t].remaining;
        var stKeys = Object.keys(dcs[dci].byType[t].st);
        for (var ski = 0; ski < stKeys.length; ski++) {
          var sk2 = stKeys[ski];
          sysBy[t].st[sk2] = (sysBy[t].st[sk2] || 0) + dcs[dci].byType[t].st[sk2];
        }
      }
    }
    return { dcs: dcs, byType: sysBy };
  }

  function buildDCDATA(baselineCsvText, currentCsvText) {
    var _phase = 'parse';
    try {
      var rows = parseCSV(currentCsvText);
      if (rows.length < 2) throw new Error('Current sheet has fewer than 2 rows');
      var baseRows = parseCSV(baselineCsvText);
      if (baseRows.length < 2) throw new Error('Baseline sheet has fewer than 2 rows');

      _phase = 'header (rows=' + rows.length + ')';
      var header = [];
      for (var hi = 0; hi < rows[0].length; hi++) {
        header.push((rows[0][hi] || '').trim().replace(/ /g, ' '));
      }

      function colIdx(name, fallback) {
        for (var x = 0; x < header.length; x++) {
          if (header[x] === name) return x;
        }
        for (var x = 0; x < header.length; x++) {
          if (header[x] && (header[x].indexOf(name) !== -1 || name.indexOf(header[x]) !== -1)) return x;
        }
        return fallback;
      }
      var C_DATE     = colIdx('วันที่บิล',    2);
      var C_DC_DEST  = colIdx('DC ปลายทาง',  17);
      var C_STATUS   = colIdx('สถานะบิล',    19);
      var C_BILLTYPE = colIdx('ประเภทบิล',   24);

      _phase = 'pass1 (C_DATE=' + C_DATE + ' C_DC=' + C_DC_DEST + ' C_TYPE=' + C_BILLTYPE + ')';
      var dcMap  = {};
      var dateArr = [];
      var dateIndex = {};

      for (var i = 1; i < rows.length; i++) {
        var row  = rows[i];
        var dc   = row[C_DC_DEST]  ? row[C_DC_DEST].trim()  : '';
        var date = row[C_DATE]     ? row[C_DATE].trim()      : '';
        var type = row[C_BILLTYPE] ? row[C_BILLTYPE].trim()  : '';
        var stat = row[C_STATUS]   ? row[C_STATUS].trim()    : '';
        if (!dc || !date) continue;

        var isCold = type.indexOf('Coldchain') !== -1;

        if (dateIndex[date] === undefined) {
          dateIndex[date] = dateArr.length;
          dateArr.push(date);
        }

        if (!dcMap[dc]) dcMap[dc] = { cells: {}, st: {} };
        if (!dcMap[dc].cells[date]) dcMap[dc].cells[date] = { gen: 0, cold: 0 };
        if (isCold) dcMap[dc].cells[date].cold++;
        else        dcMap[dc].cells[date].gen++;

        var sk = statusByCode[stat] ? statusByCode[stat].key : 'other';
        dcMap[dc].st[sk] = (dcMap[dc].st[sk] || 0) + 1;
      }

      if (dateArr.length === 0) throw new Error('Column C_DATE=' + C_DATE + ' has no data');

      _phase = 'dates (unique=' + dateArr.length + ')';
      var DATES_raw = [];
      for (var di = 0; di < dateArr.length; di++) {
        var raw = dateArr[di];
        var d = parseThaiDate(raw);
        DATES_raw.push({
          key:   raw,
          day:   d ? (d.getDate() < 10 ? '0' + d.getDate() : '' + d.getDate()) : raw.slice(0, 2),
          month: d ? TM[d.getMonth()] : '',
          age:   billAgeToday(d),
          ts:    d ? d.getTime() : 0,
        });
      }
      DATES_raw.sort(function(a, b) { return a.ts - b.ts; });
      var DATES = DATES_raw;

      _phase = 'matrix (dcs=' + Object.keys(dcMap).length + ' dates=' + DATES.length + ')';
      var dcEntries = Object.keys(dcMap);
      var matrix = [];
      for (var mi = 0; mi < dcEntries.length; mi++) {
        var name = dcEntries[mi];
        var dc2 = dcMap[name];
        var totGen = 0, totCold = 0;
        var cells = [];
        for (var dj = 0; dj < DATES.length; dj++) {
          var c = dc2.cells[DATES[dj].key] || { gen: 0, cold: 0 };
          totGen  += c.gen;
          totCold += c.cold;
          cells.push({ gen: c.gen, cold: c.cold, total: c.gen + c.cold });
        }
        var codeMatch = name.match(/^(\d+)/);
        var code = codeMatch ? codeMatch[1] : name;
        var tot = totGen + totCold;
        if (tot > 0) {
          matrix.push({ code: code, name: name, region: '', cells: cells, totGen: totGen, totCold: totCold, tot: tot, st: dc2.st });
        }
      }
      matrix.sort(function(a, b) { return b.tot - a.tot; });

      _phase = 'totals';
      var colTot = [];
      for (var ci2 = 0; ci2 < DATES.length; ci2++) {
        var ct = { gen: 0, cold: 0, total: 0 };
        for (var ri = 0; ri < matrix.length; ri++) {
          ct.gen   += matrix[ri].cells[ci2].gen;
          ct.cold  += matrix[ri].cells[ci2].cold;
          ct.total += matrix[ri].cells[ci2].total;
        }
        colTot.push(ct);
      }
      var grand = { gen: 0, cold: 0, total: 0 };
      for (var gi = 0; gi < matrix.length; gi++) {
        grand.gen   += matrix[gi].totGen;
        grand.cold  += matrix[gi].totCold;
        grand.total += matrix[gi].tot;
      }

      _phase = 'system';
      var stTot = {};
      for (var sti = 0; sti < STATUSES.length; sti++) {
        var sk2 = STATUSES[sti].key;
        var n = 0;
        for (var ri2 = 0; ri2 < matrix.length; ri2++) n += (matrix[ri2].st[sk2] || 0);
        stTot[sk2] = n;
      }
      var coldFrac = grand.total ? grand.cold / grand.total : 0;
      var curGen = {}, curCold = {};
      for (var sti2 = 0; sti2 < STATUSES.length; sti2++) {
        var sk3 = STATUSES[sti2].key;
        var cv = Math.round((stTot[sk3] || 0) * coldFrac);
        curCold[sk3] = cv;
        curGen[sk3]  = (stTot[sk3] || 0) - cv;
      }

      var SYSTEM = {
        baseline: 0, cleared: 0, remaining: 0,
        curTotal:     grand.total,
        curGenTotal:  grand.gen,
        curColdTotal: grand.cold,
        cur: stTot, curGen: curGen, curCold: curCold,
        dcCount: matrix.length, sampleCount: matrix.length,
        byType: {
          all:  { baseline: 0, cleared: 0, remaining: 0, st: {} },
          gen:  { baseline: 0, cleared: 0, remaining: 0, st: {} },
          cold: { baseline: 0, cleared: 0, remaining: 0, st: {} },
        },
      };

      var cmp = buildCompareData(parseBillRows(baseRows), parseBillRows(rows));
      SYSTEM.baseline  = cmp.byType.all.baseline;
      SYSTEM.cleared   = cmp.byType.all.cleared;
      SYSTEM.remaining = cmp.byType.all.remaining;
      SYSTEM.byType    = cmp.byType;
      return { STATUSES: STATUSES, dcs: cmp.dcs, SYSTEM: SYSTEM, DATES: DATES, matrix: matrix, colTot: colTot, grand: grand, currentItems: [] };

    } catch (e) {
      var msg = (e && e.message) ? e.message : String(e);
      if (msg.charAt(0) === '[') throw e;
      throw new Error('[' + _phase + '] ' + msg);
    }
  }

  window.loadLiveData = function(baselineUrl, currentUrl) {
    function doFetch(url, label) {
      return fetch(url).then(function(resp) {
        if (!resp.ok) {
          var hints = resp.status === 403 ? ' — sheet not published as public CSV' : '';
          throw new Error(label + ' HTTP ' + resp.status + hints);
        }
        return resp.text();
      });
    }
    return Promise.all([doFetch(baselineUrl, 'Baseline'), doFetch(currentUrl, 'Current')])
      .then(function(texts) { return buildDCDATA(texts[0], texts[1]); });
  };

  window._buildDCDATAfromCSV = buildDCDATA;

})();
</script>

<!-- shared.jsx — design system primitives -->
<script type="text/babel">
if (typeof document !== 'undefined' && !document.getElementById('bill-tokens')) {
  const st = document.createElement('style');
  st.id = 'bill-tokens';
  st.textContent = `
    .billapp{
      --bg:#f4f6fa; --surface:#ffffff; --surface-2:#fafbfd;
      --ink:#1e2733; --ink-2:#59626f; --ink-3:#929aa7;
      --line:#e6eaf1; --line-2:#eef1f6;
      --blue:#1f5fbf; --blue-deep:#163f7c; --blue-soft:#eaf1fb; --blue-edge:#d6e2f5;
      --green:#1f8a5b; --green-soft:#e6f3ec;
      --red:#c5432f; --red-soft:#fbeae5;
      font-family:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif;
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    .billapp *{box-sizing:border-box;}
    .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-feature-settings:'tnum' 1;letter-spacing:-.01em;}
    .billapp ::selection{background:#cfe0f8;}
  `;
  document.head.appendChild(st);
}

const C = {
  bg: '#f4f6fa', surface: '#ffffff', surface2: '#fafbfd',
  ink: '#1e2733', ink2: '#59626f', ink3: '#929aa7',
  line: '#e6eaf1', line2: '#eef1f6',
  blue: '#1f5fbf', blueDeep: '#163f7c', blueSoft: '#eaf1fb', blueEdge: '#d6e2f5',
  green: '#1f8a5b', greenSoft: '#e6f3ec',
  red: '#c5432f', redSoft: '#fbeae5',
};

const fmt = (n) => Math.round(n).toLocaleString('en-US');
const pct = (part, whole) => (whole ? Math.round((part / whole) * 100) : 0);

function DeltaPill({ value, size = 'md', showPct, base }) {
  const good = value <= 0;
  const col = value === 0 ? C.ink3 : good ? C.green : C.red;
  const bg = value === 0 ? C.line2 : good ? C.greenSoft : C.redSoft;
  const arrow = value === 0 ? '–' : good ? '▼' : '▲';
  const p = showPct && base ? ` ${Math.abs(pct(value, base))}%` : '';
  const pad = size === 'sm' ? '2px 7px' : '3px 9px';
  const fs = size === 'sm' ? 12 : 13;
  return (
    <span className="num" style={{
      display: 'inline-flex', alignItems: 'center', gap: 4, padding: pad,
      borderRadius: 999, background: bg, color: col, fontSize: fs, fontWeight: 600,
      lineHeight: 1, whiteSpace: 'nowrap',
    }}>
      <span style={{ fontSize: fs - 3 }}>{arrow}</span>
      {value > 0 ? '+' : value < 0 ? '−' : ''}{fmt(Math.abs(value))}{p}
    </span>
  );
}

function CompareBars({ baseline, current, max, height = 7, gap = 6, labels = true }) {
  const m = max || Math.max(baseline, current, 1);
  const row = (label, val, color, track) => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      {labels && <span style={{ width: 30, fontSize: 11, color: C.ink3, flex: '0 0 auto' }}>{label}</span>}
      <div style={{ flex: 1, height, background: track, borderRadius: 99 }}>
        <div style={{ width: `${(val / m) * 100}%`, height: '100%', background: color, borderRadius: 99 }} />
      </div>
      <span className="num" style={{ width: 42, textAlign: 'right', fontSize: 12, color: C.ink2, flex: '0 0 auto' }}>{fmt(val)}</span>
    </div>
  );
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap }}>
      {row('ตั้งต้น', baseline, C.ink3, C.line2)}
      {row('ใหม่', current, C.blue, C.blueSoft)}
    </div>
  );
}

function DCBadge({ code, tone = 'blue' }) {
  const map = {
    blue: [C.blueSoft, C.blueDeep, C.blueEdge],
    plain: [C.surface2, C.ink2, C.line],
  };
  const [bg, fg, bd] = map[tone] || map.blue;
  return (
    <span className="num" style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      minWidth: 44, height: 24, padding: '0 8px', borderRadius: 6,
      background: bg, color: fg, border: `1px solid ${bd}`,
      fontSize: 12, fontWeight: 600, letterSpacing: '.02em',
    }}>{code}</span>
  );
}

function SnapChip({ label, date, tone }) {
  const isNew = tone === 'new';
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 1, padding: '6px 12px',
      borderRadius: 8, background: isNew ? C.blueSoft : C.surface2,
      border: `1px solid ${isNew ? C.blueEdge : C.line}`,
    }}>
      <span style={{ fontSize: 10.5, color: isNew ? C.blue : C.ink3, fontWeight: 600, letterSpacing: '.02em' }}>{label}</span>
      <span className="num" style={{ fontSize: 13, color: C.ink, fontWeight: 600 }}>{date}</span>
    </div>
  );
}

function SyncChip() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: C.ink3 }}>
      <span style={{ width: 7, height: 7, borderRadius: 99, background: C.green, boxShadow: `0 0 0 3px ${C.greenSoft}` }} />
      Live · Google Sheet
    </div>
  );
}

const dcLabel = (name) => (name || '').replace(/^\d+\s+/, '');

Object.assign(window, { C, fmt, pct, DeltaPill, CompareBars, DCBadge, SnapChip, SyncChip, dcLabel });
</script>

<!-- directionB2.jsx — main app components -->
<script type="text/babel">
const { useState: useStateB2 } = React;

const clrPct = (d) => Math.round(d.cleared / d.baseline * 100);
const failOf = (obj) => (obj.f1 || 0) + (obj.f2 || 0) + (obj.f3 || 0);

function StatusBar({ st, total, height = 9, radius = 5 }) {
  const STATUSES = window.DCDATA.STATUSES;
  return (
    <div style={{ display: 'flex', width: '100%', height, borderRadius: radius, overflow: 'hidden', background: C.line2 }}>
      {STATUSES.map((s) => {
        const v = st[s.key] || 0;
        if (!v) return null;
        return <div key={s.key} title={`${s.short} · ${v}`} style={{ width: `${v / total * 100}%`, background: s.color }} />;
      })}
    </div>
  );
}

function StatusLegend({ columns = 1, valueOf }) {
  const STATUSES = window.DCDATA.STATUSES;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: `repeat(${columns}, 1fr)`, gap: columns > 1 ? '8px 22px' : 8 }}>
      {STATUSES.map((s) =>
        <div key={s.key} style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
          <span style={{ width: 9, height: 9, borderRadius: 3, background: s.color, flex: '0 0 auto' }} />
          <span style={{ fontSize: 12.5, color: C.ink2, flex: 1, minWidth: 0 }}>{s.short}</span>
          <span className="num" style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>{fmt(valueOf(s))}</span>
        </div>
      )}
    </div>
  );
}

function ThB2({ children, align = 'right', w }) {
  return <th style={{ textAlign: align, padding: '10px 16px', fontSize: 11.5, fontWeight: 600, color: C.ink3, whiteSpace: 'nowrap', width: w }}>{children}</th>;
}

function TdNum({ children, color, bold, sub }) {
  return (
    <td style={{ textAlign: 'right', padding: '11px 16px', whiteSpace: 'nowrap' }}>
      <div className="num" style={{ fontSize: 14, color: color || C.ink, fontWeight: bold ? 600 : 500 }}>{children}</div>
      {sub && <div className="num" style={{ fontSize: 11, color: C.ink3, marginTop: 1 }}>{sub}</div>}
    </td>
  );
}

function StatusDetail({ d, stObj, total, title, showCleared, compact }) {
  const STATUSES = window.DCDATA.STATUSES;
  const failTotal = failOf(stObj);
  return (
    <div style={{ background: 'linear-gradient(180deg,#f7faff,#fff)', borderBottom: `2px solid ${C.blueEdge}`, padding: compact ? '12px 16px 14px' : '16px 24px 18px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 13.5, fontWeight: 700 }}>{title} · {dcLabel(d.name)}</span>
        <span className="num" style={{ fontSize: 12, fontWeight: 700, color: C.blue, background: C.blueSoft, borderRadius: 99, padding: '2px 9px' }}>{fmt(total)} บิล</span>
        {showCleared && <span style={{ fontSize: 12, color: C.ink3 }}>· เคลียร์แล้ว {fmt(d.cleared)} ({clrPct(d)}%)</span>}
        {failTotal > 0 && <span style={{ fontSize: 12, fontWeight: 600, color: C.red, background: C.redSoft, borderRadius: 99, padding: '2px 9px' }}>ส่งไม่ได้ {fmt(failTotal)} บิล</span>}
      </div>
      <div style={{ marginBottom: 14 }}><StatusBar st={stObj} total={total} height={12} /></div>
      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, overflow: 'hidden' }}>
        {(() => {
          const knownTotal = STATUSES.reduce((a, s) => a + (stObj[s.key] || 0), 0);
          const otherCount = total - knownTotal;
          const rows = STATUSES.filter((s) => (stObj[s.key] || 0) > 0);
          return (
            <React.Fragment>
              {rows.map((s, i) => {
                const v = stObj[s.key] || 0;
                const p = Math.round(v / total * 100);
                return (
                  <div key={s.key} style={{ display: 'grid', gridTemplateColumns: compact ? '1fr 64px' : '20px 1fr 220px 64px 56px', alignItems: 'center', gap: 12, padding: '11px 16px', borderTop: i ? `1px solid ${C.line2}` : 'none' }}>
                    {!compact && <span style={{ width: 11, height: 11, borderRadius: 3, background: s.color }} />}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        {compact && <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flex: '0 0 auto' }} />}
                        <span style={{ fontSize: 13.5, fontWeight: 600 }}>{s.short}</span>
                      </div>
                      <span className="num" style={{ fontSize: 11, color: C.ink3 }}>{s.code}</span>
                    </div>
                    {!compact &&
                      <div style={{ height: 6, background: C.line2, borderRadius: 99, overflow: 'hidden' }}>
                        <div style={{ width: `${p}%`, height: '100%', background: s.color, borderRadius: 99 }} />
                      </div>
                    }
                    {!compact && <span className="num" style={{ textAlign: 'right', fontSize: 12.5, color: C.ink3 }}>{p}%</span>}
                    <span className="num" style={{ textAlign: 'right', fontSize: 15, fontWeight: 600, color: C.ink }}>{fmt(v)}</span>
                  </div>
                );
              })}
              {otherCount > 0 && (
                <div style={{ display: 'grid', gridTemplateColumns: compact ? '1fr 64px' : '20px 1fr 220px 64px 56px', alignItems: 'center', gap: 12, padding: '11px 16px', borderTop: rows.length ? `1px solid ${C.line2}` : 'none' }}>
                  {!compact && <span style={{ width: 11, height: 11, borderRadius: 3, background: C.ink3 }} />}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {compact && <span style={{ width: 10, height: 10, borderRadius: 3, background: C.ink3, flex: '0 0 auto' }} />}
                      <span style={{ fontSize: 13.5, fontWeight: 600 }}>อื่นๆ</span>
                    </div>
                    <span className="num" style={{ fontSize: 11, color: C.ink3 }}>–</span>
                  </div>
                  {!compact &&
                    <div style={{ height: 6, background: C.line2, borderRadius: 99, overflow: 'hidden' }}>
                      <div style={{ width: `${Math.round(otherCount / total * 100)}%`, height: '100%', background: C.ink3, borderRadius: 99 }} />
                    </div>
                  }
                  {!compact && <span className="num" style={{ textAlign: 'right', fontSize: 12.5, color: C.ink3 }}>{Math.round(otherCount / total * 100)}%</span>}
                  <span className="num" style={{ textAlign: 'right', fontSize: 15, fontWeight: 600, color: C.ink }}>{fmt(otherCount)}</span>
                </div>
              )}
            </React.Fragment>
          );
        })()}
      </div>
    </div>
  );
}

function TopBar({ tab }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 28px', background: C.surface, borderBottom: `1px solid ${C.line}` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ width: 30, height: 30, borderRadius: 8, background: C.blue, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 700, fontSize: 15 }}>บ</div>
        <div style={{ display: 'flex', flexDirection: 'column' }}>
          <span style={{ fontSize: 15.5, fontWeight: 700 }}>สถานะบิลคงค้าง · ราย DC </span>
          <span style={{ fontSize: 11.5, color: C.ink3 }}>{tab === 'compare' ? 'ยึดเลขที่บิลจากไฟล์ตั้งต้น · บิลที่ไม่พบในไฟล์ใหม่ = เคลียร์แล้ว' : 'บิลคงค้างทั้งหมดจากไฟล์ใหม่ (ข้อมูลล่าสุด)'}</span>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        {tab === 'compare' ?
          <React.Fragment>
            <SnapChip label="ไฟล์ตั้งต้น" date="31 พ.ค." />
            <span style={{ color: C.ink3 }}>→</span>
            <SnapChip label="ไฟล์ใหม่" date="09 มิ.ย." tone="new" />
          </React.Fragment> :
          <SnapChip label="ข้อมูลล่าสุด" date="Live" tone="new" />
        }
      </div>
    </div>
  );
}

function TabBar({ tab, setTab, mobile }) {
  const tabs = [
    { id: 'compare', label: 'เปรียบเทียบการเปลี่ยนแปลง' },
    { id: 'current', label: 'บิลคงค้างปัจจุบัน' },
  ];
  return (
    <div style={{ display: 'flex', gap: mobile ? 0 : 4, padding: mobile ? '0 12px' : '0 24px', background: C.surface, borderBottom: `1px solid ${C.line}` }}>
      {tabs.map((t) => {
        const active = tab === t.id;
        return (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex: mobile ? 1 : '0 0 auto', appearance: 'none', border: 'none', background: 'transparent', cursor: 'pointer',
            padding: mobile ? '13px 8px' : '13px 16px', fontFamily: 'inherit', fontSize: mobile ? 13.5 : 14,
            fontWeight: active ? 700 : 500, color: active ? C.blue : C.ink2,
            borderBottom: `2.5px solid ${active ? C.blue : 'transparent'}`, marginBottom: -1,
          }}>{t.label}</button>
        );
      })}
    </div>
  );
}

function FilterBar({ dcs, SYSTEM }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 28px', background: C.surface2, borderBottom: `1px solid ${C.line}` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 12px', background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, width: 220, color: C.ink3, fontSize: 13 }}>
        <span style={{ fontSize: 14 }}>⌕</span> ค้นหา DC…
      </div>
      {['ทุกภูมิภาค', 'กลาง', 'เหนือ', 'อีสาน', 'ใต้', 'ตะวันออก'].map((t, i) =>
        <span key={t} style={{ padding: '7px 13px', borderRadius: 8, fontSize: 13, fontWeight: 600, background: i === 0 ? C.blue : C.surface, color: i === 0 ? '#fff' : C.ink2, border: `1px solid ${i === 0 ? C.blue : C.line}` }}>{t}</span>
      )}
      <div style={{ flex: 1 }} />
      <span style={{ fontSize: 12.5, color: C.ink3 }}>แสดง {dcs.length} จาก {SYSTEM.dcCount} DC</span>
    </div>
  );
}

function KpiBlock({ items }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', padding: '18px 28px', borderRight: `1px solid ${C.line}` }}>
      {items.map((it, i) =>
        <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 4, padding: i === 0 ? '0 24px 0 0' : '0 24px', borderRight: i < items.length - 1 ? `1px solid ${C.line}` : 'none' }}>
          <span style={{ fontSize: 12, color: C.ink2, whiteSpace: 'nowrap' }}>{it.label}</span>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span className="num" style={{ fontSize: 27, fontWeight: 600, lineHeight: 1, color: it.color || C.ink }}>{it.value}</span>
            {it.tag && <span className="num" style={{ fontSize: 12, fontWeight: 600, color: it.color }}>{it.tag}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

function StatusSummary({ stObj, total, title }) {
  return (
    <div style={{ padding: '14px 28px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 9 }}>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: C.ink2 }}>{title}</span>
        <SyncChip />
      </div>
      <div style={{ marginBottom: 11 }}><StatusBar st={stObj} total={total} height={10} /></div>
      <StatusLegend columns={3} valueOf={(s) => stObj[s.key]} />
    </div>
  );
}

function SortTh({ label, k, sort, setSort, align = 'right', w }) {
  const active = sort.key === k;
  const arrow = active ? sort.dir === 'asc' ? '▲' : '▼' : '⇅';
  return (
    <th onClick={() => setSort((s) => ({ key: k, dir: s.key === k && s.dir === 'desc' ? 'asc' : 'desc' }))}
      style={{ cursor: 'pointer', textAlign: align, padding: '10px 16px', fontSize: 11.5, fontWeight: 600, color: active ? C.blue : C.ink3, whiteSpace: 'nowrap', width: w, userSelect: 'none' }}>
      {label}<span style={{ marginLeft: 5, fontSize: 9, color: active ? C.blue : C.line }}>{arrow}</span>
    </th>
  );
}

function CompareDesktop() {
  const { dcs, SYSTEM } = window.DCDATA;
  const [open, setOpen] = useStateB2(null);
  const [ptype, setPtype] = useStateB2('all');
  const [sort, setSort] = useStateB2({ key: 'remaining', dir: 'desc' });
  const T = (d) => d.byType[ptype];
  const S = SYSTEM.byType[ptype];
  const counts = { all: SYSTEM.byType.all.baseline, gen: SYSTEM.byType.gen.baseline, cold: SYSTEM.byType.cold.baseline };
  const sorted = [...dcs].sort((a, b) => {
    if (sort.key === 'name') return sort.dir === 'asc' ? a.name.localeCompare(b.name, 'th') : b.name.localeCompare(a.name, 'th');
    return sort.dir === 'asc' ? T(a)[sort.key] - T(b)[sort.key] : T(b)[sort.key] - T(a)[sort.key];
  });
  return (
    <React.Fragment>
      <div style={{ display: 'flex', alignItems: 'center', padding: '14px 28px', background: C.surface, borderBottom: `1px solid ${C.line}` }}>
        <ProductTabs value={ptype} onChange={setPtype} counts={counts} big />
      </div>
      <div style={{ background: C.surface, borderBottom: `1px solid ${C.line}` }}>
        <KpiBlock items={[
          { label: 'บิลตั้งต้น', value: fmt(S.baseline) },
          { label: 'เคลียร์แล้ว', value: `−${fmt(S.cleared)}`, color: C.green, tag: `${pct(S.cleared, S.baseline)}%` },
          { label: 'ยังคงค้าง', value: fmt(S.remaining), color: C.blue },
        ]} />
      </div>
      <FilterBar dcs={dcs} SYSTEM={SYSTEM} />
      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ background: C.surface2, borderBottom: `1px solid ${C.line}` }}>
            <SortTh label="DC ปลายทาง" k="name" sort={sort} setSort={setSort} align="left" />
            <SortTh label="บิลตั้งต้น" k="baseline" sort={sort} setSort={setSort} w={130} />
            <SortTh label="เคลียร์แล้ว" k="cleared" sort={sort} setSort={setSort} w={150} />
            <SortTh label="ยังคงค้าง" k="remaining" sort={sort} setSort={setSort} w={130} />
            <ThB2 w={46}></ThB2>
          </tr>
        </thead>
        <tbody>
          {sorted.map((d, i) => {
            const isOpen = open === d.code;
            const t = T(d);
            const clr = t.baseline ? Math.round(t.cleared / t.baseline * 100) : 0;
            return (
              <React.Fragment key={d.code}>
                <tr onClick={() => setOpen(isOpen ? null : d.code)} style={{ borderBottom: `1px solid ${C.line2}`, background: isOpen ? C.blueSoft : i % 2 ? C.surface2 : C.surface, cursor: 'pointer' }}>
                  <td style={{ padding: '11px 16px', fontSize: 14, fontWeight: 600 }}>{dcLabel(d.name)}</td>
                  <TdNum color={C.ink3}>{fmt(t.baseline)}</TdNum>
                  <TdNum color={C.green} bold sub={`${clr}%`}>−{fmt(t.cleared)}</TdNum>
                  <TdNum color={C.blue} bold>{fmt(t.remaining)}</TdNum>
                  <td style={{ padding: '9px 16px', textAlign: 'center', color: C.ink3, fontSize: 13, transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>›</td>
                </tr>
                {isOpen && <tr style={{ background: '#fff' }}><td colSpan={5} style={{ padding: 0 }}><StatusDetail d={{ ...d, baseline: t.baseline, cleared: t.cleared }} stObj={t.st} total={t.remaining} title="ยังคงค้าง แยกตามสถานะบิล" showCleared /></td></tr>}
              </React.Fragment>
            );
          })}
        </tbody>
        <tfoot>
          <tr style={{ borderTop: `2px solid ${C.blueEdge}`, background: C.blueSoft }}>
            <td style={{ padding: '13px 16px', fontSize: 14, fontWeight: 700, color: C.blueDeep }}>รวม {SYSTEM.dcCount} DC</td>
            <td className="num" style={{ padding: '13px 16px', textAlign: 'right', fontSize: 14, fontWeight: 700, color: C.blueDeep }}>{fmt(S.baseline)}</td>
            <td className="num" style={{ padding: '13px 16px', textAlign: 'right', fontSize: 14, fontWeight: 700, color: C.green }}>−{fmt(S.cleared)}</td>
            <td className="num" style={{ padding: '13px 16px', textAlign: 'right', fontSize: 14, fontWeight: 700, color: C.blue }}>{fmt(S.remaining)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </React.Fragment>
  );
}

function ProductChip({ type }) {
  const cold = type === 'cold';
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12, fontWeight: 600, padding: '3px 9px', borderRadius: 99, background: cold ? C.blueSoft : C.surface2, color: cold ? C.blue : C.ink2, border: `1px solid ${cold ? C.blueEdge : C.line}` }}>
      <span style={{ width: 7, height: 7, borderRadius: 99, background: cold ? C.blue : C.ink3 }} />
      {cold ? 'Coldchain' : 'ทั่วไป'}
    </span>
  );
}

function ProductTabs({ value, onChange, counts, big }) {
  const opts = [{ id: 'all', label: 'ทั้งหมด' }, { id: 'gen', label: 'สินค้าทั่วไป' }, { id: 'cold', label: 'สินค้า Coldchain' }];
  return (
    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
      {opts.map((o) => {
        const a = value === o.id;
        return (
          <button key={o.id} onClick={() => onChange(o.id)} style={{
            appearance: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8,
            padding: big ? '9px 15px' : '7px 12px', borderRadius: 9, fontFamily: 'inherit', fontSize: 13.5, fontWeight: 600,
            background: a ? C.blue : C.surface, color: a ? '#fff' : C.ink2, border: `1px solid ${a ? C.blue : C.line}`,
          }}>
            {o.label}
            <span className="num" style={{ fontSize: 12, fontWeight: 700, padding: '1px 7px', borderRadius: 99, background: a ? 'rgba(255,255,255,.22)' : C.surface2, color: a ? '#fff' : C.ink3 }}>{fmt(counts[o.id])}</span>
          </button>
        );
      })}
    </div>
  );
}

function curObjOf(ptype) {
  const { SYSTEM } = window.DCDATA;
  return ptype === 'gen' ? SYSTEM.curGen : ptype === 'cold' ? SYSTEM.curCold : SYSTEM.cur;
}
function curCounts() {
  const { SYSTEM } = window.DCDATA;
  return { all: SYSTEM.curTotal, gen: SYSTEM.curGenTotal, cold: SYSTEM.curColdTotal };
}

function pcell(cell, ptype) { return ptype === 'gen' ? cell.gen : ptype === 'cold' ? cell.cold : cell.total; }
function prow(row, ptype) { return ptype === 'gen' ? row.totGen : ptype === 'cold' ? row.totCold : row.tot; }

function CurrentDesktop() {
  const { SYSTEM, DATES, matrix, colTot, grand } = window.DCDATA;
  const [ptype, setPtype] = useStateB2('all');
  const counts = curCounts();
  const grandTot = prow({ totGen: grand.gen, totCold: grand.cold, tot: grand.total }, ptype);
  return (
    <React.Fragment>
      <div style={{ display: 'flex', alignItems: 'center', padding: '14px 28px', background: C.surface, borderBottom: `1px solid ${C.line}` }}>
        <ProductTabs value={ptype} onChange={setPtype} counts={counts} big />
      </div>
      <FilterBar dcs={matrix} SYSTEM={SYSTEM} />
      <div style={{ padding: '10px 28px 4px', fontSize: 12, color: C.ink3 }}>จำนวนบิลคงค้าง แยกตาม DC ปลายทาง × วันที่บิล</div>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ background: C.surface2, borderBottom: `1px solid ${C.line}` }}>
              <ThB2 align="left" w={220}>DC ปลายทาง</ThB2>
              {DATES.map((d) => <ThB2 key={d.key} w={66}><div className="num" style={{ fontWeight: 600, color: C.ink2 }}>{d.day}</div><div style={{ fontWeight: 400, fontSize: 10, color: C.ink3, marginTop: 1 }}>{d.month}</div></ThB2>)}
              <ThB2 w={92}>รวม</ThB2>
            </tr>
          </thead>
          <tbody>
            {matrix.map((row, i) => {
              const rt = prow(row, ptype);
              return (
                <tr key={row.code} style={{ borderBottom: `1px solid ${C.line2}`, background: i % 2 ? C.surface2 : C.surface }}>
                  <td style={{ padding: '10px 16px', fontSize: 14, fontWeight: 600 }}>{dcLabel(row.name)}</td>
                  {row.cells.map((cell, ci) => {
                    const v = pcell(cell, ptype);
                    return <td key={ci} className="num" style={{ textAlign: 'right', padding: '10px 16px', fontSize: 13.5, color: v ? C.ink2 : C.line }}>{v ? fmt(v) : '·'}</td>;
                  })}
                  <td className="num" style={{ textAlign: 'right', padding: '10px 16px', fontSize: 14, fontWeight: 700, color: C.blue, background: C.blueSoft }}>{fmt(rt)}</td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr style={{ borderTop: `2px solid ${C.blueEdge}`, background: C.blueSoft }}>
              <td style={{ padding: '12px 16px', fontSize: 14, fontWeight: 700, color: C.blueDeep }}>รวม {SYSTEM.dcCount} DC</td>
              {colTot.map((ct, ci) =>
                <td key={ci} className="num" style={{ textAlign: 'right', padding: '12px 16px', fontSize: 13.5, fontWeight: 700, color: C.blueDeep }}>{fmt(pcell(ct, ptype))}</td>
              )}
              <td className="num" style={{ textAlign: 'right', padding: '12px 16px', fontSize: 14, fontWeight: 800, color: C.blueDeep }}>{fmt(grandTot)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', padding: '14px 28px', borderTop: `1px solid ${C.line}`, background: C.surface }}>
        <span style={{ fontSize: 12.5, color: C.ink3 }}>แสดง {matrix.length} DC</span>
      </div>
    </React.Fragment>
  );
}

const AGING_BUCKETS = [
  { label: '1–3 วัน', test: (a) => a >= 1 && a <= 3 },
  { label: '4–5 วัน', test: (a) => a >= 4 && a <= 5 },
  { label: '6–7 วัน', test: (a) => a >= 6 && a <= 7 },
  { label: '8–14 วัน', test: (a) => a >= 8 && a <= 14 },
  { label: '>14 วัน', test: (a) => a >= 15 },
];

function CurrentMobile() {
  const { DATES, matrix, SYSTEM } = window.DCDATA;
  const [ptype, setPtype] = useStateB2('all');
  const [q, setQ] = useStateB2('');
  const counts = curCounts();

  const rows = matrix.map((row) => {
    const b = [0, 0, 0, 0, 0];
    let oi = -1;
    DATES.forEach((dateObj, i) => {
      const v = pcell(row.cells[i], ptype);
      if (!v) return;
      if (oi === -1) oi = i;
      const age = dateObj.age;
      const bi = AGING_BUCKETS.findIndex((bk) => bk.test(age));
      if (bi >= 0) b[bi] += v;
    });
    const tot = b.reduce((a, v) => a + v, 0);
    const oldest = oi >= 0 ? `${DATES[oi].day} ${DATES[oi].month}` : null;
    return { ...row, b, tot, oldest };
  }).filter((r) => r.tot > 0);

  const colTots = AGING_BUCKETS.map((_, bi) => rows.reduce((a, r) => a + r.b[bi], 0));
  const filtered = rows.filter((r) => matchDC(r, q));

  return (
    <React.Fragment>
      <div style={{ padding: '12px 16px', background: C.surface, borderBottom: `1px solid ${C.line}` }}>
        <div style={{ marginBottom: 10 }}><ProductTabs value={ptype} onChange={setPtype} counts={counts} /></div>
        <MobileSearch q={q} setQ={setQ} shown={filtered.length} total={SYSTEM.dcCount} />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr repeat(5, 40px)', gap: 0, alignItems: 'end', padding: '10px 12px 8px', background: C.surface2, borderBottom: `1px solid ${C.line}` }}>
        <span style={{ fontSize: 10.5, fontWeight: 600, color: C.ink3 }}>DC ปลายทาง</span>
        {AGING_BUCKETS.map((bk, i) => (
          <div key={i} style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 9.5, fontWeight: 600, color: C.ink2, lineHeight: 1.2 }}>{bk.label}</div>
          </div>
        ))}
      </div>
      {filtered.map((d, ri) => (
        <div key={d.code} style={{ display: 'grid', gridTemplateColumns: '1fr repeat(5, 40px)', alignItems: 'center', padding: '9px 12px', background: ri % 2 ? C.surface2 : C.surface, borderBottom: `1px solid ${C.line2}` }}>
          <div style={{ minWidth: 0, paddingRight: 6 }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{dcLabel(d.name)}</div>
            <div style={{ fontSize: 10.5, color: C.ink3, marginTop: 2, whiteSpace: 'nowrap' }}>
              เก่าสุด <span className="num" style={{ color: C.ink2, fontWeight: 600 }}>{d.oldest || '–'}</span>
              {' · '}รวม <span className="num" style={{ color: C.blue, fontWeight: 700 }}>{fmt(d.tot)}</span>
            </div>
          </div>
          {d.b.map((v, i) => (
            <span key={i} className="num" style={{ textAlign: 'center', fontSize: 12.5, fontWeight: v ? 600 : 400, color: !v ? C.line : i >= 3 ? C.red : C.ink2 }}>
              {v || '·'}
            </span>
          ))}
        </div>
      ))}
      {filtered.length === 0 && (
        <div style={{ padding: '34px 16px', textAlign: 'center', fontSize: 13, color: C.ink3, background: C.surface }}>
          ไม่พบ DC ที่ตรงกับ "{q}"
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr repeat(5, 40px)', alignItems: 'center', padding: '11px 12px', background: C.blueSoft, borderTop: `2px solid ${C.blueEdge}` }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.blueDeep }}>รวม {SYSTEM.dcCount} DC</span>
        {colTots.map((v, i) => (
          <span key={i} className="num" style={{ textAlign: 'center', fontSize: 12, fontWeight: 700, color: C.blueDeep }}>{fmt(v)}</span>
        ))}
      </div>
    </React.Fragment>
  );
}

function DesktopB2() {
  const [tab, setTab] = useStateB2('compare');
  return (
    <div className="billapp" style={{ width: '100%', minHeight: 1180, background: C.bg }}>
      <TopBar tab={tab} />
      <TabBar tab={tab} setTab={setTab} />
      {tab === 'compare' ? <CompareDesktop /> : <CurrentDesktop />}
    </div>
  );
}

function MobileKpi({ items }) {
  return (
    <div style={{ display: 'flex', background: C.surface2, border: `1px solid ${C.line}`, borderRadius: 10, padding: '11px 6px' }}>
      {items.map((it, i) =>
        <React.Fragment key={i}>
          {i > 0 && <div style={{ width: 1, background: C.line }} />}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2, alignItems: 'center', flex: 1 }}>
            <span className="num" style={{ fontSize: 16, fontWeight: 600, color: it.color || C.ink }}>{it.value}</span>
            <span style={{ fontSize: 10, color: C.ink3 }}>{it.label}</span>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function MobileSearch({ q, setQ, shown, total }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 11 }}>
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: C.surface, border: `1px solid ${q ? C.blueEdge : C.line}`, borderRadius: 9, minWidth: 0 }}>
        <span style={{ fontSize: 15, color: C.ink3, flex: '0 0 auto' }}>⌕</span>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ค้นหา DC…"
          style={{ flex: 1, minWidth: 0, border: 'none', outline: 'none', background: 'transparent', fontFamily: 'inherit', fontSize: 13.5, color: C.ink }} />
        {q && <span onClick={() => setQ('')} style={{ cursor: 'pointer', color: C.ink3, fontSize: 16, lineHeight: 1, flex: '0 0 auto' }}>×</span>}
      </div>
      <span className="num" style={{ fontSize: 11.5, color: C.ink3, whiteSpace: 'nowrap', flex: '0 0 auto' }}>{shown}/{total} DC</span>
    </div>
  );
}

function matchDC(d, q) {
  const s = q.trim().toLowerCase();
  if (!s) return true;
  return (d.name || '').toLowerCase().includes(s) || (d.code || '').toLowerCase().includes(s);
}

function MobileTable() {
  const { dcs, SYSTEM } = window.DCDATA;
  const [open, setOpen] = useStateB2(null);
  const [q, setQ] = useStateB2('');
  const [sort, setSort] = useStateB2({ key: 'remaining', dir: 'desc' });
  const sorted = [...dcs].sort((a, b) => {
    if (sort.key === 'name') return sort.dir === 'asc' ? a.name.localeCompare(b.name, 'th') : b.name.localeCompare(a.name, 'th');
    return sort.dir === 'asc' ? a[sort.key] - b[sort.key] : b[sort.key] - a[sort.key];
  });
  const filtered = sorted.filter((d) => matchDC(d, q));
  const sortLabel = (label, k, align = 'right') => {
    const active = sort.key === k;
    return (
      <span onClick={() => setSort((s) => ({ key: k, dir: s.key === k && s.dir === 'desc' ? 'asc' : 'desc' }))}
        style={{ textAlign: align, cursor: 'pointer', color: active ? C.blue : C.ink3, userSelect: 'none' }}>
        {label}{active ? sort.dir === 'asc' ? ' ▲' : ' ▼' : ' ⇅'}
      </span>
    );
  };
  return (
    <React.Fragment>
      <div style={{ padding: '12px 16px', background: C.surface, borderBottom: `1px solid ${C.line}` }}>
        <MobileKpi items={[
          { label: 'บิลตั้งต้น', value: fmt(SYSTEM.baseline) },
          { label: 'เคลียร์แล้ว', value: `−${fmt(SYSTEM.cleared)}`, color: C.green },
          { label: 'ยังคงค้าง', value: fmt(SYSTEM.remaining), color: C.blue },
        ]} />
        <MobileSearch q={q} setQ={setQ} shown={filtered.length} total={SYSTEM.dcCount} />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 72px 72px 16px', gap: 6, padding: '10px 16px', fontSize: 11, fontWeight: 600, borderBottom: `1px solid ${C.line}`, background: C.surface2 }}>
        {sortLabel('DC ปลายทาง', 'name', 'left')}
        {sortLabel('เคลียร์', 'cleared')}
        {sortLabel('คงค้าง', 'remaining')}
        <span></span>
      </div>
      {filtered.map((d, i) => {
        const isOpen = open === d.code;
        return (
          <div key={d.code}>
            <div onClick={() => setOpen(isOpen ? null : d.code)} style={{ display: 'grid', gridTemplateColumns: '1fr 72px 72px 16px', gap: 6, alignItems: 'center', padding: '11px 16px', background: isOpen ? C.blueSoft : i % 2 ? C.surface2 : C.surface, borderBottom: `1px solid ${C.line2}` }}>
              <span style={{ fontSize: 13, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{dcLabel(d.name)}</span>
              <span className="num" style={{ textAlign: 'right', fontSize: 13.5, color: C.green, fontWeight: 600 }}>−{fmt(d.cleared)}</span>
              <span className="num" style={{ textAlign: 'right', fontSize: 13.5, color: C.blue, fontWeight: 600 }}>{fmt(d.remaining)}</span>
              <span style={{ textAlign: 'center', color: C.ink3, transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>›</span>
            </div>
            {isOpen && <StatusDetail d={d} stObj={d.st} total={d.remaining} title="ยังคงค้าง แยกตามสถานะ" showCleared compact />}
          </div>
        );
      })}
      {filtered.length === 0 &&
        <div style={{ padding: '34px 16px', textAlign: 'center', fontSize: 13, color: C.ink3, background: C.surface }}>ไม่พบ DC ที่ตรงกับ "{q}"</div>
      }
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 72px 72px 16px', gap: 6, alignItems: 'center', padding: '13px 16px', background: C.blueSoft, borderTop: `2px solid ${C.blueEdge}` }}>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: C.blueDeep }}>รวม {SYSTEM.dcCount} DC</span>
        <span className="num" style={{ textAlign: 'right', fontSize: 13.5, color: C.green, fontWeight: 700 }}>−{fmt(SYSTEM.cleared)}</span>
        <span className="num" style={{ textAlign: 'right', fontSize: 13.5, color: C.blue, fontWeight: 700 }}>{fmt(SYSTEM.remaining)}</span>
        <span></span>
      </div>
    </React.Fragment>
  );
}

function MobileB2() {
  const [tab, setTab] = useStateB2('compare');
  return (
    <div className="billapp" style={{ width: '100%', minHeight: 1020, background: C.bg }}>
      <div style={{ position: 'sticky', top: 0, zIndex: 5 }}>
        <TopBar tab={tab} />
        <TabBar tab={tab} setTab={setTab} mobile />
      </div>
      {tab === 'compare' ? <MobileTable /> : <CurrentMobile />}
    </div>
  );
}

Object.assign(window, { DesktopB2, MobileB2 });
</script>

<!-- App bootstrap -->
<script type="text/babel">
const SHEET_BASELINE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQeMv14vrWH-hu18OoP1cd2oeLTDTsV-cVFU8oO793DOPmQfMwo-jaEEnKAH8OcHgLo6ZCAUF5vH7jK/pub?gid=0&output=csv';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQeMv14vrWH-hu18OoP1cd2oeLTDTsV-cVFU8oO793DOPmQfMwo-jaEEnKAH8OcHgLo6ZCAUF5vH7jK/pub?gid=300055796&output=csv';

function SetupScreen() {
  return (
    <div className="billapp" style={{ minHeight: '100vh', background: '#f4f6fa', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div style={{ maxWidth: 520, width: '100%', background: '#fff', borderRadius: 16, border: `1px solid ${C.line}`, padding: '36px 32px', boxShadow: '0 4px 24px rgba(0,0,0,.07)' }}>
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 8 }}>สถานะบิลคงค้าง · ราย DC</div>
        <div style={{ fontSize: 13, color: C.ink2 }}>กรุณาตั้งค่า SHEET_CSV_URL ใน app-live.html</div>
      </div>
    </div>
  );
}

function LoadingScreen() {
  return (
    <div className="billapp" style={{ minHeight: '100vh', background: '#f4f6fa', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 20 }}>
      <div style={{ width: 44, height: 44, borderRadius: 11, background: C.blue, color: '#fff', fontWeight: 700, fontSize: 20, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>บ</div>
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>กำลังโหลดข้อมูล…</div>
        <div style={{ fontSize: 12.5, color: C.ink3 }}>ดึงข้อมูลจาก Google Sheet</div>
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        {[0, 1, 2].map((i) => (
          <div key={i} style={{ width: 8, height: 8, borderRadius: 4, background: C.blue, opacity: 0.3, animation: `pulse 1.2s ease-in-out ${i * 0.2}s infinite` }} />
        ))}
      </div>
      <style>{`@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }`}</style>
    </div>
  );
}

function ErrorScreen({ error, onRetry }) {
  const is403 = error.includes('403');
  return (
    <div className="billapp" style={{ minHeight: '100vh', background: '#f4f6fa', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div style={{ maxWidth: 520, width: '100%', background: '#fff', borderRadius: 16, border: `1px solid ${C.line}`, padding: '32px 28px', boxShadow: '0 4px 24px rgba(0,0,0,.07)' }}>
        <div style={{ width: 44, height: 44, borderRadius: 22, background: '#fbeae5', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 16, fontSize: 20 }}>⚠</div>
        <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 8, color: C.ink }}>โหลดข้อมูลไม่สำเร็จ</div>
        <div className="num" style={{ fontSize: 12, color: C.red, background: '#fbeae5', borderRadius: 7, padding: '8px 12px', marginBottom: 16, wordBreak: 'break-all' }}>{error}</div>
        {is403 && (
          <div style={{ background: C.blueSoft, border: `1px solid ${C.blueEdge}`, borderRadius: 10, padding: '12px 14px', marginBottom: 16, fontSize: 13, color: C.ink2, lineHeight: 1.6 }}>
            <strong>สาเหตุ:</strong> ชีตยังไม่ได้เปิดเป็นสาธารณะ<br />
            ต้องใช้ <strong>File → Share → Publish to web</strong>
          </div>
        )}
        <button onClick={onRetry} style={{ width: '100%', padding: '12px 0', background: C.blue, color: '#fff', border: 'none', borderRadius: 9, fontFamily: 'inherit', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
          ลองใหม่อีกครั้ง
        </button>
      </div>
    </div>
  );
}

function App() {
  const [phase, setPhase] = React.useState(() => (SHEET_CSV_URL && SHEET_BASELINE_CSV_URL) ? 'loading' : 'setup');
  const [error, setError] = React.useState('');
  const [, forceUpdate] = React.useState(0);
  const isMobile = window.innerWidth < 768;

  const load = React.useCallback(() => {
    if (!SHEET_CSV_URL || !SHEET_BASELINE_CSV_URL) { setPhase('setup'); return; }
    setPhase('loading');
    window.loadLiveData(SHEET_BASELINE_CSV_URL, SHEET_CSV_URL)
      .then((data) => {
        window.DCDATA = data;
        setPhase('ready');
        forceUpdate((n) => n + 1);
      })
      .catch((err) => {
        setError(err.message || String(err));
        setPhase('error');
      });
  }, []);

  React.useEffect(() => { load(); }, [load]);

  if (phase === 'setup')   return <SetupScreen />;
  if (phase === 'loading') return <LoadingScreen />;
  if (phase === 'error')   return <ErrorScreen error={error} onRetry={load} />;

  return (
    <div style={{ minHeight: '100vh' }}>
      {isMobile ? <MobileB2 /> : <DesktopB2 />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
